[package]
name = "rust-screen-recorder"
version = "0.1.0"
edition = "2021"
description = "Gravador de tela desktop para Windows em Rust"
license = "MIT"

[dependencies]
eframe = "0.31"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
